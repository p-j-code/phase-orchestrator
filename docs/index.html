<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ashmero Orchestrator — Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0">
  <meta name="description" content="Documentation for the Ashmero Orchestrator">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* Slight tweaks: wider content area on desktop, mermaid centred */
    .markdown-section { max-width: 920px; }
    .mermaid { text-align: center; margin: 1.5em 0; }
    /* Make the Cheat-sheet table in PLAYBOOK readable without sideways scroll */
    .markdown-section table { display: table; width: 100%; font-size: 0.92em; }
    .markdown-section table td:nth-child(3) { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.85em; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'Orchestrator Docs',
      repo: '',
      loadSidebar: '_sidebar.md',
      auto2top: true,
      subMaxLevel: 2,
      homepage: 'PLAYBOOK.md',
      coverpage: false,
      mergeNavbar: true,
      search: {
        maxAge: 86400000, // 1 day cache
        paths: 'auto',
        placeholder: 'Search…',
        noData: 'No results.',
        depth: 4,
      },
      // Render Mermaid blocks
      markdown: {
        renderer: {
          code(code, lang) {
            if (lang === 'mermaid') {
              return `<div class="mermaid">${code}</div>`;
            }
            return this.origin.code.apply(this, arguments);
          },
        },
      },
      plugins: [
        function (hook) {
          hook.doneEach(() => {
            if (window.mermaid) {
              window.mermaid.run({ querySelector: '.mermaid' });
            }
          });
        },
      ],
    };
  </script>
  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy-to-clipboard for code blocks -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Syntax highlighting (Prism) -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <!-- Mermaid -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
      sequence: { useMaxWidth: true },
    });
    window.mermaid = mermaid;
    // Re-render after each route change (docsify SPA)
    if (window.$docsify && window.mermaid) {
      window.mermaid.run({ querySelector: '.mermaid' });
    }
  </script>
</body>
</html>
